<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}URL Shortener{% endblock %}</title>
    <!-- Removed Tailwind -->
    <!-- Added Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Dark mode styles */
        .dark .bg-gray-100 {
            background-color: #1a202c;
            /* Dark background */
        }

        .dark .text-gray-800 {
            color: #e2e8f0;
            /* Light text */
        }

        .dark .text-gray-800 button {
            color: black;
            /* Light text */
        }

        .dark .bg-white {
            background-color: #2d3748;
            /* Darker background for form */
        }

        .dark .border-gray-300 {
            border-color: #4a5568;
            /* Darker border */
        }

        .dark .text-gray-700 {
            color: #edf2f7;
            /* Light text for labels */
        }

        .dark .text-blue-500 {
            color: #63b3ed;
            /* Light color for links */
        }
    </style>
    <!-- Matomo -->
    <script>
        var _paq = window._paq = window._paq || [];
        /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function () {
            var u = "//matomo.luova.club/";
            _paq.push(['setTrackerUrl', u + 'matomo.php']);
            _paq.push(['setSiteId', '7']);
            var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
            g.async = true;
            g.src = u + 'matomo.js';
            s.parentNode.insertBefore(g, s);
        })();
    </script>
    <!-- End Matomo Code -->
</head>

<!-- Modified body class for Bootstrap dark mode -->
<body class="bg-dark text-light">
    <!-- Bootstrap Navbar replacing header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">URL Shortener</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                </ul>
                <span class="navbar-text d-flex align-items-center">
                    <img src="{{ current_user.profile_pic }}" alt="Profile Picture" class="rounded-circle me-2" width="30" height="30">
                    Welcome, {{ current_user.display_name }} &nbsp; | &nbsp;
                    <a href="/logout" class="text-info">Logout</a>
                </span>
            </div>
        </div>
    </nav>
    <!-- ...existing content... -->
    <div class="max-w-3xl mx-auto p-4">
        {% block content %}
        {% endblock %}
    </div>
    <!-- Updated footer with Bootstrap classes -->
    <footer class="bg-dark text-light p-4 text-center">
        <p>&copy; 2025 LuovaClub</p>
     
    </footer>
    {% block scripts %}
    {% endblock %}
    <!-- Added Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("DOM content loaded");
            // Always enable dark mode (redundant with Bootstrap dark classes)
            document.documentElement.classList.add("dark");
        });
    </script>
</body>

</html>
