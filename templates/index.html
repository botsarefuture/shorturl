{% extends "base.html" %}

{% block title %}URL Shortener{% endblock %}

{% block content %}
<h1 id="page-title" class="display-4 mb-4">URL Shortener</h1>

<div class="card bg-dark text-light p-4 mb-4">
  <form id="url-form">
    <div class="mb-3">
      <label for="long_url" class="form-label" id="long-url-label">Long URL:</label>
      <input type="url" id="long_url" name="long_url" required class="form-control bg-secondary text-light" />
    </div>
    <button type="submit" class="btn btn-primary">
      Create Short URL
    </button>
  </form>
</div>

<hr class="my-4" />

<div id="short-url-result">
  <!-- Short URL will be displayed here -->
</div>

{% endblock %}

{% block scripts %}
<script>
  /**
   * Initialize the page and register event listeners.
   *
   * Parameters
   * ----------
   * None
   *
   * Returns
   * -------
   * None
   */
  document.addEventListener("DOMContentLoaded", () => {
    console.log("DOM content loaded");
    // Force dark mode to match base.html and dashboard.html
    document.documentElement.classList.add("dark");

    // Handle form submission for creating a short URL
    document.getElementById("url-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      console.log("Form submitted");

      const form = event.target;
      const form_data = Object.fromEntries(new FormData(form));
      console.log("Form data:", form_data);

      try {
        const response = await fetch("/api/create", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(form_data)
        });

        const data = await response.json();
        console.log("API response:", data);

        document.getElementById("short-url-result").innerHTML = response.ok
          ? `<p class="text-success">Short URL: <a href="${data.short_url}" target="_blank" class="text-info text-decoration-underline">${data.short_url}</a></p>`
          : `<p class="text-danger">${data.error}</p>`;
      } catch (error) {
        console.error("Error:", error);
        document.getElementById("short-url-result").innerHTML = `<p class="text-danger">An error occurred: ${error.message}</p>`;
      }
    });
  });
</script>
{% endblock %}
